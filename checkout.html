<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDCEPTA EDUCATION</title>
    <link rel="stylesheet" href="styles.css?v=54">
    <style>
        .checkout-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            padding: 3rem 0;
        }

        .checkout-form {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
        }

        .form-section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .form-section:last-child {
            border-bottom: none;
        }

        .form-section h3 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: var(--dark-text);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark-text);
        }

        .form-group input,
        .form-group select {
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .checkout-summary {
            background-color: var(--bg-card);
            border: 2px solid rgba(249, 115, 22, 0.25);
            border-radius: 8px;
            padding: 2rem;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .checkout-popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(30, 41, 59, 0.35);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .checkout-popup-overlay.show {
            display: flex;
        }
        .checkout-popup-overlay--glass {
            background: linear-gradient(
                145deg,
                rgba(30, 64, 175, 0.22) 0%,
                rgba(30, 41, 59, 0.38) 45%,
                rgba(249, 115, 22, 0.18) 100%
            );
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .checkout-popup {
            background: var(--white);
            border-radius: 10px;
            padding: 1.5rem 1.75rem;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(30, 41, 59, 0.15), 0 0 40px rgba(249, 115, 22, 0.2);
            position: relative;
            border-left: 4px solid;
        }
        .checkout-popup.info { border-left-color: var(--primary-mint); }
        .checkout-popup.success { border-left-color: var(--primary-mint-dark); }
        .checkout-popup.error { border-left-color: var(--danger-color); }
        .checkout-popup.payment-unavailable {
            border-left: none;
            border-radius: 20px;
            padding: 2.25rem 2.5rem 2rem;
            max-width: 400px;
            text-align: center;
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.94) 0%,
                rgba(255, 247, 237, 0.9) 38%,
                rgba(239, 246, 255, 0.88) 72%,
                rgba(255, 255, 255, 0.92) 100%
            );
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow:
                0 28px 64px rgba(30, 64, 175, 0.14),
                0 12px 32px rgba(249, 115, 22, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
            overflow: hidden;
            animation: checkoutPopupIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .checkout-popup.payment-unavailable::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                120deg,
                rgba(249, 115, 22, 0.12) 0%,
                transparent 42%,
                rgba(30, 64, 175, 0.1) 58%,
                rgba(34, 197, 94, 0.08) 100%
            );
            pointer-events: none;
        }
        .checkout-popup.payment-unavailable::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(
                90deg,
                var(--primary) 0%,
                var(--secondary) 50%,
                var(--accent) 100%
            );
        }
        .checkout-popup.payment-unavailable .checkout-popup-content {
            position: relative;
            z-index: 1;
            padding: 0.5rem 0.5rem 0 0;
            font-size: 1.125rem;
            font-weight: 600;
            line-height: 1.45;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }
        .checkout-popup.payment-unavailable .checkout-popup-close {
            z-index: 2;
            top: 0.85rem;
            right: 0.85rem;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(30, 41, 59, 0.08);
            color: var(--text-secondary);
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .checkout-popup.payment-unavailable .checkout-popup-close:hover {
            background: rgba(249, 115, 22, 0.12);
            color: var(--primary-mint-dark);
            transform: scale(1.05);
        }
        @keyframes checkoutPopupIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .checkout-popup-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--text-tertiary);
            line-height: 1;
            padding: 0.15rem;
        }
        .checkout-popup-close:hover { color: var(--text-main); }
        .checkout-popup-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            padding-right: 1.5rem;
        }
        .checkout-popup-content a {
            color: var(--primary-mint-dark);
            font-weight: 600;
        }

        .summary-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .cart-items {
            margin-bottom: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: var(--surface-elevated);
            border-radius: 5px;
            margin-bottom: 0.8rem;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .cart-item-price {
            color: var(--primary-color);
            font-weight: bold;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .cart-item-remove:hover {
            transform: scale(1.2);
        }

        .cart-item-remove:before {
            content: "✕";
        }

        .summary-divider {
            border-top: 1px solid var(--border-color);
            margin: 1rem 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        .summary-row.total {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 1rem;
        }

        .empty-cart {
            text-align: center;
            padding: 3rem;
            background-color: var(--surface-elevated);
            border-radius: 8px;
        }

        .empty-cart p {
            font-size: 1.1rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        .empty-cart .btn {
            margin-top: 1rem;
        }

        .promo-section {
            margin: 1.5rem 0;
        }

        .promo-input {
            display: flex;
            gap: 0.5rem;
        }

        .promo-input input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 5px;
        }

        .promo-input button {
            padding: 0.8rem 1.5rem;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .promo-input button:hover {
            background-color: #5a6268;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--success-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .checkout-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(40,167,69,0.3);
        }

        .checkout-btn:disabled {
            background-color: var(--secondary-color);
            cursor: not-allowed;
            transform: none;
        }

        .guarantee {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--secondary-color);
        }

        .guarantee-icon {
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }

            .checkout-summary {
                position: relative;
                top: 0;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">

                <a href="/" class="logo">

    <!-- Checkout message popup -->
    <div id="checkoutPopupOverlay" class="checkout-popup-overlay" role="dialog" aria-live="polite" onclick="if (event.target === this) hideCheckoutMessage();">
        <div id="checkoutPopup" class="checkout-popup" onclick="event.stopPropagation();">
            <button type="button" class="checkout-popup-close" onclick="hideCheckoutMessage()" aria-label="Close">&times;</button>
            <div id="checkoutPopupContent" class="checkout-popup-content"></div>
        </div>

<script src="config.js"></script>
    <script src="data/courses_data.js?v=4"></script>
    <script src="script-api.js?v=5"></script>
    <script>
        let discountAmount = 0;

        function showCheckoutMessage(msg, type) {
            type = type || 'info';
            const overlay = document.getElementById('checkoutPopupOverlay');
            const popup = document.getElementById('checkoutPopup');
            const content = document.getElementById('checkoutPopupContent');
            content.innerHTML = msg;
            popup.className = 'checkout-popup ' + type;
            overlay.classList.toggle('checkout-popup-overlay--glass', type === 'payment-unavailable');
            overlay.classList.add('show');
        }

        function hideCheckoutMessage() {
            const overlay = document.getElementById('checkoutPopupOverlay');
            overlay.classList.remove('show', 'checkout-popup-overlay--glass');
        }

        // Initialize checkout
        document.addEventListener('DOMContentLoaded', function() {
            loadCartItems();
            calculateTotal();
            setupHamburgerMenu();
        });

        function loadCartItems() {
            const selectedCourse = JSON.parse(localStorage.getItem('selectedCourse'));
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const checkoutItems = JSON.parse(localStorage.getItem('checkoutItems')) || [];
            let allItems = [];

            // Priority: checkoutItems > selectedCourse > cart
            if (checkoutItems.length > 0) {
                allItems = checkoutItems;
            } else if (selectedCourse) {
                allItems = [selectedCourse];
                localStorage.removeItem('selectedCourse');
            } else if (cart.length > 0) {
                allItems = cart;
            } else {
                showEmptyCart();
                return;
            }

            const itemsContainer = document.getElementById('cartItemsContainer');
            itemsContainer.innerHTML = '';

            allItems.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.title}</div>
                        <div class="cart-item-price">₹${parseInt(item.price).toLocaleString()}</div>
                    </div>
                    <button class="cart-item-remove" onclick="removeItem(${index})"></button>
                `;
                itemsContainer.appendChild(itemDiv);
            });

            // Show price section and hide empty cart message
            document.getElementById('priceSection').style.display = 'block';
            document.getElementById('completeCheckoutBtn').disabled = false;

            // Always store items as checkoutItems for consistency
            localStorage.setItem('checkoutItems', JSON.stringify(allItems));
        }

        function removeItem(index) {
            const items = JSON.parse(localStorage.getItem('checkoutItems')) || [];
            items.splice(index, 1);
            
            if (items.length === 0) {
                localStorage.removeItem('checkoutItems');
                localStorage.removeItem('cart');
                localStorage.removeItem('selectedCourse');
                discountAmount = 0;
                showEmptyCart();
            } else {
                localStorage.setItem('checkoutItems', JSON.stringify(items));
                loadCartItems();
                calculateTotal();
            }
        }

        function showEmptyCart() {
            const itemsContainer = document.getElementById('cartItemsContainer');
            itemsContainer.innerHTML = '<div class="empty-cart"><p>📭 Your cart is empty</p><p style="font-size: 0.95rem; color: var(--secondary-color); margin-bottom: 1rem;">Please add items to your cart before checkout</p><a href="/" class="btn btn-primary" style="display: inline-block;">Continue Shopping</a></div>';
            document.getElementById('completeCheckoutBtn').disabled = true;
            
            // Hide price section when cart is empty
            document.getElementById('priceSection').style.display = 'none';
            
            // Reset all totals to zero
            discountAmount = 0;
            document.getElementById('subtotal').textContent = '₹0';
            document.getElementById('discount').textContent = '-₹0';
            document.getElementById('tax').textContent = '₹0';
            document.getElementById('total').textContent = '₹0';
        }

        function calculateTotal() {
            const items = JSON.parse(localStorage.getItem('checkoutItems')) || [];
            const subtotal = items.reduce((sum, item) => sum + parseInt(item.price), 0);
            const tax = Math.round(subtotal * 0.18);
            const total = subtotal - discountAmount + tax;

            document.getElementById('subtotal').textContent = '₹' + subtotal.toLocaleString();
            document.getElementById('discount').textContent = '-₹' + discountAmount.toLocaleString();
            document.getElementById('tax').textContent = '₹' + tax.toLocaleString();
            document.getElementById('total').textContent = '₹' + total.toLocaleString();
        }

        function applyPromo() {
            const promoCode = document.getElementById('promoCode').value.toUpperCase();
            const promoCodes = {
                'SAVE10': 0.10,
                'SAVE20': 0.20,
                'SAVE50': 0.50,
                'WELCOME': 1000
            };

            if (!promoCode) {
                showCheckoutMessage('Please enter a promo code.', 'error');
                return;
            }

            if (promoCodes[promoCode]) {
                const items = JSON.parse(localStorage.getItem('checkoutItems')) || [];
                const subtotal = items.reduce((sum, item) => sum + parseInt(item.price), 0);
                
                if (typeof promoCodes[promoCode] === 'number' && promoCodes[promoCode] < 1) {
                    discountAmount = Math.round(subtotal * promoCodes[promoCode]);
                } else {
                    discountAmount = promoCodes[promoCode];
                }
                
                showCheckoutMessage(`Promo code applied! Discount: ₹${discountAmount}`, 'success');
                calculateTotal();
                document.getElementById('promoCode').value = '';
            } else {
                showCheckoutMessage('Invalid promo code.', 'error');
                discountAmount = 0;
                calculateTotal();
            }
        }

        function setupHamburgerMenu() {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.querySelector('.nav-links');
            
            hamburger.addEventListener('click', function() {
                navLinks.classList.toggle('active');
            });

            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', function() {
                    navLinks.classList.remove('active');
                });
            });
        }

        async function completeCheckout() {
            hideCheckoutMessage();

            // Check if user is logged in
            const currentUser = getCurrentUser(); // using script-api helper
            if (!currentUser) {
                showCheckoutMessage('You need to log in to complete your purchase. <a href="/login" style="color: var(--primary-mint-dark); font-weight: 600;">Go to Login</a>', 'error');
                return;
            }

            // Validate form
            const requiredFields = ['firstName', 'lastName', 'email', 'phone', 'address', 'city', 'state', 'postalCode', 'country'];
            for (let field of requiredFields) {
                if (!document.getElementById(field).value) {
                    showCheckoutMessage('Please fill in all required fields.', 'error');
                    return;
                }
            }

            const paymentMethod = document.getElementById('paymentMethod').value;

            if (!document.getElementById('agreeTerms').checked) {
                showCheckoutMessage('Please agree to the terms and conditions.', 'error');
                return;
            }

            const checkoutBtn = document.getElementById('completeCheckoutBtn');
            const originalText = checkoutBtn.innerText;
            checkoutBtn.innerText = 'Processing...';
            checkoutBtn.disabled = true;

            try {
                const items = JSON.parse(localStorage.getItem('checkoutItems')) || [];
                
                if (items.length === 0) {
                    showCheckoutMessage('Your cart is empty.', 'error');
                    checkoutBtn.innerText = originalText;
                    checkoutBtn.disabled = false;
                    return;
                }

                // Payments disabled until gateway is live
                if (typeof CONFIG !== 'undefined' && CONFIG.PAYMENTS_ENABLED === false) {
                    await new Promise(function (r) { setTimeout(r, 500); });
                    showCheckoutMessage('Payment is not available right now.', 'payment-unavailable');
                    return;
                }

                // Collect billing info
                const billingInfo = {
                    name: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    city: document.getElementById('city').value,
                    state: document.getElementById('state').value,
                    zipCode: document.getElementById('postalCode').value,
                    country: document.getElementById('country').value
                };

                let successCount = 0;
                let failCount = 0;
                let lastOrderId = '';

                // Backend currently supports single course per order, so we loop
                for (const item of items) {
                    const price = parseInt(item.price);
                    
                    const orderData = {
                        courseId: item.id || item._id, // Handle both formats
                        amount: price,
                        discount: 0, // Ignoring partial discount for simplicity
                        tax: Math.round(price * 0.18),
                        paymentMethod: paymentMethod,
                        billingInfo: billingInfo,
                        promoCode: document.getElementById('promoCode').value || null
                    };

                    const result = await createOrder(orderData);
                    if (result.success) {
                        successCount++;
                         lastOrderId = result.data._id || result.data.id;
                    } else {
                        console.error('Order failed for item:', item.title, result.error);
                        failCount++;
                    }
                }

                if (successCount > 0) {
                    // Clear cart
                    localStorage.removeItem('checkoutItems');
                    localStorage.removeItem('cart');
                    localStorage.removeItem('selectedCourse');

                    // Show success message on page
                    const msg = failCount > 0 
                        ? `Orders placed partially. ${successCount} successful, ${failCount} failed.`
                        : `Order placed successfully! Order ID: ${lastOrderId}. Total items: ${successCount}. Check your email for confirmation.`;
                    showCheckoutMessage(msg, 'success');

                    // Redirect to user dashboard
                    setTimeout(() => {
                        window.location.href = '/user-dashboard';
                    }, 2000);
                } else {
                    showCheckoutMessage('We couldn\'t place your order. Please try again.', 'error');
                }

            } catch (error) {
                console.error('Checkout error:', error);
                showCheckoutMessage('Payment page is under process. Please <a href="/contact" style="color: var(--primary-mint-dark); font-weight: 600;">contact us</a> to complete your purchase.', 'info');
            } finally {
                checkoutBtn.innerText = originalText;
                checkoutBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
